plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	mavenCentral()
}

loom {
	runs {
		// Opens the title screen, saves a screenshot and exits. Used by CI under Xvfb:
		// xvfb-run ./gradlew runSelftestClient
		selftestClient {
			client()
			name = "Self-test client"
			runDir = project.findProperty("selftestDir") ?: "run-selftest"
			vmArg "-Dminehouse.selftest=true"
			programArgs "--username", "Steve"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Reproducible jars: no file timestamps, fixed order. The same sources give a byte-identical jar,
// so anyone can rebuild it from P5ina/minehouse-mods and compare SHA-256 with the jar in the modpack.
tasks.withType(AbstractArchiveTask).configureEach {
	preserveFileTimestamps = false
	reproducibleFileOrder = true
}
