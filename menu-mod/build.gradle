plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	mavenCentral()
}

// Google's mirror of Maven Central goes first, ahead of the Central that Loom adds itself
// (Central sometimes answers CI with 404 for test jars, and Gradle caches the miss).
def centralMirror = repositories.maven {
	name = "MavenCentralMirror"
	url = "https://maven-central.storage-download.googleapis.com/maven2/"
}
repositories.remove(centralMirror)
repositories.addFirst(centralMirror)

loom {
	runs {
		// Self-tests for CI under Xvfb, one part of the mod per run:
		//   xvfb-run ./gradlew runSelftestClient                    title screen screenshot (menu)
		//   xvfb-run ./gradlew runSelftestClient -Pselftest=anvil   anvil mixin + cost packet
		//   xvfb-run ./gradlew runSelftestClient -Pselftest=editor  show editor panel screenshot
		//   xvfb-run ./gradlew runSelftestClient -Pselftest=zones   zone packet, codec, gizmos
		selftestClient {
			client()
			name = "Self-test client"
			runDir = project.findProperty("selftestDir") ?: "run-selftest"
			vmArg "-Dminehouse.selftest=${project.findProperty("selftest") ?: "true"}"
			programArgs "--username", "Steve"
		}
		// Joins a local server, draws made-up zones, saves run-demo/screenshots/zones-demo.png and exits.
		// Start any 26.3 server on localhost:25565 (online-mode=false) first.
		demoClient {
			client()
			name = "Demo client"
			runDir = "run-demo"
			vmArg "-Dminehouse.zones.demo=true"
			programArgs "--username", "Steve", "--quickPlayMultiplayer", "localhost:25565"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Pure-Java H.264 decoder for the intro video (BSD-2-Clause), bundled inside the jar.
	implementation "org.jcodec:jcodec:0.2.5"
	include "org.jcodec:jcodec:0.2.5"

	testImplementation platform("org.junit:junit-bom:5.13.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Reproducible jars: no file timestamps, fixed order. The same sources give a byte-identical jar,
// so anyone can rebuild it from P5ina/minehouse-mods and compare SHA-256 with the jar in the modpack.
tasks.withType(AbstractArchiveTask).configureEach {
	preserveFileTimestamps = false
	reproducibleFileOrder = true
}
