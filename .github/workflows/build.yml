name: Build

# Builds every mod from mods.txt. On main, a mod whose version has no release yet gets one:
# tag <dir>-v<version>, the jar and its SHA-256.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      mods: ${{ steps.mods.outputs.mods }}
    steps:
      - uses: actions/checkout@v4
      - id: mods
        run: echo "mods=$(grep -v '^\s*$' mods.txt | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  build:
    needs: list
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mod: ${{ fromJson(needs.list.outputs.mods) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        working-directory: ${{ matrix.mod }}
        run: ./gradlew build --stacktrace

      - name: Jar and SHA-256
        id: jar
        run: |
          jar=$(ls ${{ matrix.mod }}/build/libs/*.jar | grep -v -- '-sources' | head -1)
          version=$(grep '^version=' ${{ matrix.mod }}/gradle.properties | cut -d= -f2)
          (cd "$(dirname "$jar")" && sha256sum "$(basename "$jar")" > "$(basename "$jar").sha256")
          cat "$jar.sha256"
          echo "### ${{ matrix.mod }} $version" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat "$jar.sha256" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "jar=$jar" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.mod }}
          path: |
            ${{ steps.jar.outputs.jar }}
            ${{ steps.jar.outputs.jar }}.sha256

      - name: Release new version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ matrix.mod }}-v${{ steps.jar.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already released"
            exit 0
          fi
          jar="${{ steps.jar.outputs.jar }}"
          notes="Собрано GitHub Actions из коммита ${GITHUB_SHA}.

          SHA-256:
          \`\`\`
          $(cat "$jar.sha256")
          \`\`\`
          Сверить с jar из своей папки mods: \`sha256sum\` (Linux), \`shasum -a 256\` (macOS), \`Get-FileHash\` (Windows PowerShell) или \`python3 verify.py\`."
          gh release create "$tag" "$jar" "$jar.sha256" --target "$GITHUB_SHA" --title "$tag" --notes "$notes"
